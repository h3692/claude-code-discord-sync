name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y tmux
      - run: npm ci
      - run: npm test
      - name: Check the tag matches package.json
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json $version"
            exit 1
          fi
      - name: Pack
        run: |
          npm pack
          tgz="claude-code-discord-sync-${GITHUB_REF_NAME#v}.tgz"
          sha256sum "$tgz"
          # A fixed name, so releases/latest/download/claude-code-discord-sync.tgz always serves the newest.
          cp "$tgz" claude-code-discord-sync.tgz
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "claude-code-discord-sync-${GITHUB_REF_NAME#v}.tgz" claude-code-discord-sync.tgz \
            --title "$GITHUB_REF_NAME" --generate-notes
